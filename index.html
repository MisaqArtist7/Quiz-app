<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style/output.css">
    <title>Quiz App</title>
</head>
<body class="bg-black text-zinc-100 font-sans antialiased">
    
    <main class="min-h-screen flex justify-center items-center px-4">
        <section class="hidden qa-section w-full max-w-md">

            <div class="qa-wrapper bg-zinc-900/80 backdrop-blur-xl border border-zinc-800 p-8 rounded-3xl shadow-2xl text-center flex flex-col items-center">
                
                <!-- عنوان اصلی -->
                <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">
                    Quiz App
                </h1>
                
                <!-- زیرعنوان -->
                <span class="text-zinc-400 text-sm mb-6 font-medium">
                    Test your knowledge
                </span>
                
                <!-- بج تعداد سوالات -->
                <div class="inline-flex items-center gap-2 bg-zinc-800/80 border border-zinc-700/60 text-zinc-300 px-4 py-1.5 rounded-full text-xs font-semibold mb-8">
                    <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                    <span>10 Questions</span>
                </div>
                
                <!-- دکمه شروع -->
                <button id="start-btn" class="w-full py-3.5 px-6 rounded-2xl bg-white hover:bg-zinc-200 text-black font-semibold shadow-lg shadow-white/5 hover:shadow-white/10 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
                    Start Quiz
                </button>

            </div>
        </section>


        <section class="qa-questions w-full max-w-md">
            <div
                class="qa-wrapper bg-zinc-900/80 backdrop-blur-xl border border-zinc-800 p-8 rounded-3xl shadow-2xl text-center flex flex-col items-center"
            >
                <span
                    id="question-count"
                    class="text-zinc-400 text-sm mb-6 font-medium"
                ></span>

                <h1
                    id="question-title"
                    class="text-3xl font-extrabold tracking-tight text-white mb-6"
                ></h1>

                <div
                    id="options"
                    class="w-full flex flex-col gap-3"
                ></div>
            </div>
        </section>


    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
